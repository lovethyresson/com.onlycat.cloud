name: CI

# Lint IS in this gate, unlike com.nibe.local's. That exclusion exists there only because the
# codebase is 4-space and eslint-config-athom wants 2, so it fails repo-wide on untouched files
# and is no signal on a change. A new repo does not have that problem, so the rule is adopted
# from the first commit rather than worked around.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The code that ships. tsconfig.json excludes test/, so this is the bundle.
      - name: Type-check the app
        run: npx tsc --noEmit

      # `npm test` runs through tsx, which strips types without checking them, so nothing else
      # would ever catch a type error in test/.
      - name: Type-check the tests
        run: npx tsc -p tsconfig.test.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Catches anything that makes the manifest unpublishable — an orphan capability instance, a
      # flow card missing titleFormatted, a missing translation — before a release does. Pinned
      # rather than `npx homey@latest` so a CLI release cannot fail the build on its own schedule.
      - name: Validate the app manifest
        run: npx --yes homey@4.5.0 app validate --level publish
