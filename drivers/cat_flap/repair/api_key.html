<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .lead { color: #666; font-size: 13px; line-height: 1.5; margin: 0 0 14px; }
        ol { color: #666; font-size: 13px; line-height: 1.6; padding-left: 20px; margin: 0 0 14px; }
        .warn { background: #fff8e6; border: 1px solid #f0dca8; border-radius: 8px;
                padding: 10px 12px; font-size: 12px; line-height: 1.5; color: #6b5a2a; margin: 0 0 16px; }
        .err { color: #d0021b; font-size: 13px; line-height: 1.5; margin: 10px 0 0; display: none; }
    </style>
</head>
<body>

<p class="lead" id="lead"></p>

<ol id="steps"></ol>

<p class="warn" id="warn"></p>

<div class="homey-form">
    <div class="homey-form-group">
        <input class="homey-form-input" id="key" type="text" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="oc_live_…">
    </div>
    <button class="homey-button-primary-full" id="submit"></button>
</div>

<p class="err" id="error"></p>

<script type="text/javascript">
    /* global Homey */

    /*
     * A PAIR view is not a settings page.
     *
     * A settings page is handed `Homey` through a global `onHomeyReady(Homey)` callback and must
     * answer with `Homey.ready()`. A pair view is not: `Homey` is already a global when this
     * script runs, nothing ever calls `onHomeyReady`, and there is no `ready()` to call.
     *
     * v0.1.0 shipped this file wrapped in `function onHomeyReady(Homey) { ... }`. Nothing called
     * it, so the page rendered with every string still empty, no click listener was ever attached,
     * and `verify_key` never reached the driver — visible from the other side as an API key that
     * OnlyCat still reported as "Never used". Keep this top-level.
     */

    Homey.setTitle(Homey.__('pair.title'));

    // Pair and repair share this file byte for byte, and Homey requires a repair view to live
    // under repair/ — so the copies must stay identical. What differs is only where to go on
    // success: pairing has a next view (the device list), repair does not and must close itself.
    // The driver tells us which session we are in rather than the view guessing.
    var mode = 'pair';
    Homey.emit('get_mode', null)
        .then(function (result) { if (result && result.mode) mode = result.mode; })
        .catch(function () { /* an older driver means pair; that is the safe default */ });

    document.getElementById('lead').textContent = Homey.__('pair.lead');
    document.getElementById('warn').textContent = Homey.__('pair.warn');
    document.getElementById('submit').textContent = Homey.__('pair.continue');

    var steps = document.getElementById('steps');
    ['pair.step1', 'pair.step2', 'pair.step3', 'pair.step4'].forEach(function (key) {
        var li = document.createElement('li');
        li.textContent = Homey.__(key);
        steps.appendChild(li);
    });

    var input = document.getElementById('key');
    var button = document.getElementById('submit');
    var error = document.getElementById('error');

    function fail(message) {
        error.textContent = message;
        error.style.display = 'block';
    }

    function submit() {
        error.style.display = 'none';

        var key = input.value.trim();
        if (!key) {
            fail(Homey.__('pair.empty'));
            return;
        }

        button.disabled = true;
        button.textContent = Homey.__('pair.checking');

        function done() {
            button.disabled = false;
            button.textContent = Homey.__('pair.continue');
        }

        // Homey.emit(event, data) returns a Promise in a pair view. The callback form is what a
        // settings page uses; passing one here is silently ignored.
        Homey.emit('verify_key', key)
            .then(function (result) {
                done();
                if (!result || !result.count) {
                    fail(Homey.__('pair.none'));
                    return;
                }
                if (mode === 'repair') Homey.done();
                else Homey.nextView();
            })
            .catch(function (err) {
                done();
                fail((err && err.message) ? err.message : String(err));
            });
    }

    button.addEventListener('click', submit);
    input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') submit();
    });
    input.focus();
</script>
</body>
</html>
